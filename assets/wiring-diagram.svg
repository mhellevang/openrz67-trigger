<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">OpenRZ67 wiring diagram</title>
  <desc id="description">An ESP32-C3 controls two active-high relay channels. The normally-open relay contacts short the Mamiya RZ67 S1 and S2 pins to camera ground. The camera's 6 volt pin is not connected.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #52606d; }
      .tiny { font-size: 12px; fill: #68737d; }
      .panel { fill: #f8fafb; stroke: #cbd5dc; stroke-width: 2; }
      .board { fill: #e9f6f1; stroke: #17815f; stroke-width: 3; }
      .relay { fill: #fff7e8; stroke: #d88718; stroke-width: 3; }
      .camera { fill: #eef3ff; stroke: #456bd1; stroke-width: 3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c13c66"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="54" y="55" class="title">ESP32-C3 to Mamiya RZ67</text>
  <text x="54" y="83" class="small">Two isolated, normally-open contacts reproduce the camera's S1 and S2 switches.</text>

  <text x="54" y="132" class="section">Controller</text>
  <rect x="54" y="150" width="280" height="420" rx="18" class="board"/>
  <text x="86" y="195" class="label">ESP32-C3</text>
  <text x="86" y="219" class="small">Development board or custom PCB</text>

  <circle cx="305" cy="275" r="6" fill="#c13c66"/>
  <text x="86" y="281" class="label">SHUTTER 1</text>
  <text x="197" y="281" class="small">digital output</text>

  <circle cx="305" cy="350" r="6" fill="#c13c66"/>
  <text x="86" y="356" class="label">SHUTTER 2</text>
  <text x="197" y="356" class="small">digital output</text>

  <circle cx="305" cy="425" r="6" fill="#d88718"/>
  <text x="86" y="431" class="label">3V3</text>
  <text x="139" y="431" class="small">relay supply</text>

  <circle cx="305" cy="500" r="6" fill="#27323a"/>
  <text x="86" y="506" class="label">GND</text>
  <text x="141" y="506" class="small">control side</text>

  <text x="398" y="132" class="section">Relay driver</text>
  <rect x="398" y="150" width="320" height="420" rx="18" class="relay"/>
  <text x="430" y="195" class="label">2 channels · active HIGH</text>
  <text x="430" y="219" class="small">3 V coils, transistor drivers and flyback diodes</text>

  <rect x="430" y="250" width="120" height="50" rx="10" fill="#fff" stroke="#d88718" stroke-width="2"/>
  <text x="490" y="281" text-anchor="middle" class="label">IN1</text>
  <path d="M 311 275 H 430" fill="none" stroke="#c13c66" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="430" y="325" width="120" height="50" rx="10" fill="#fff" stroke="#d88718" stroke-width="2"/>
  <text x="490" y="356" text-anchor="middle" class="label">IN2</text>
  <path d="M 311 350 H 430" fill="none" stroke="#c13c66" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="430" y="400" width="120" height="50" rx="10" fill="#fff" stroke="#d88718" stroke-width="2"/>
  <text x="490" y="431" text-anchor="middle" class="label">VCC</text>
  <path d="M 311 425 H 430" fill="none" stroke="#d88718" stroke-width="4" stroke-linecap="round"/>

  <rect x="430" y="475" width="120" height="50" rx="10" fill="#fff" stroke="#d88718" stroke-width="2"/>
  <text x="490" y="506" text-anchor="middle" class="label">GND</text>
  <path d="M 311 500 H 430" fill="none" stroke="#27323a" stroke-width="4" stroke-linecap="round"/>

  <line x1="592" y1="274" x2="632" y2="258" stroke="#27323a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="585" cy="275" r="6" fill="#27323a"/>
  <circle cx="645" cy="250" r="6" fill="#27323a"/>
  <text x="585" y="308" text-anchor="middle" class="tiny">COM</text>
  <text x="645" y="233" text-anchor="middle" class="tiny">NO</text>
  <text x="681" y="281" text-anchor="end" class="label">K1</text>

  <line x1="592" y1="349" x2="632" y2="333" stroke="#27323a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="585" cy="350" r="6" fill="#27323a"/>
  <circle cx="645" cy="325" r="6" fill="#27323a"/>
  <text x="585" y="383" text-anchor="middle" class="tiny">COM</text>
  <text x="645" y="308" text-anchor="middle" class="tiny">NO</text>
  <text x="681" y="356" text-anchor="end" class="label">K2</text>

  <text x="782" y="132" class="section">Camera port</text>
  <rect x="782" y="150" width="364" height="420" rx="18" class="camera"/>
  <text x="814" y="195" class="label">Mamiya RZ67</text>
  <text x="814" y="219" class="small">Front view · pins read left to right</text>

  <circle cx="850" cy="300" r="25" fill="#fff" stroke="#9ba5ad" stroke-width="3"/>
  <circle cx="930" cy="300" r="25" fill="#fff" stroke="#27323a" stroke-width="3"/>
  <circle cx="1010" cy="300" r="25" fill="#fff" stroke="#337f9c" stroke-width="3"/>
  <circle cx="1090" cy="300" r="25" fill="#fff" stroke="#337f9c" stroke-width="3"/>
  <text x="850" y="306" text-anchor="middle" class="label">1</text>
  <text x="930" y="306" text-anchor="middle" class="label">2</text>
  <text x="1010" y="306" text-anchor="middle" class="label">3</text>
  <text x="1090" y="306" text-anchor="middle" class="label">4</text>
  <text x="850" y="348" text-anchor="middle" class="label">6 V</text>
  <text x="930" y="348" text-anchor="middle" class="label">GND</text>
  <text x="1010" y="348" text-anchor="middle" class="label">S1</text>
  <text x="1090" y="348" text-anchor="middle" class="label">S2</text>

  <path d="M 645 250 H 1010 V 275" fill="none" stroke="#337f9c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 645 325 H 1090" fill="none" stroke="#337f9c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 585 275 V 455 H 930 V 325" fill="none" stroke="#27323a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="585" cy="350" r="7" fill="#27323a"/>
  <path d="M 850 325 V 385" fill="none" stroke="#9ba5ad" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7"/>
  <line x1="838" y1="388" x2="862" y2="412" stroke="#9ba5ad" stroke-width="4"/>
  <line x1="862" y1="388" x2="838" y2="412" stroke="#9ba5ad" stroke-width="4"/>
  <text x="850" y="435" text-anchor="middle" class="small">Do not connect</text>

  <rect x="54" y="616" width="1092" height="62" rx="14" class="panel"/>
  <circle cx="85" cy="647" r="10" fill="#456bd1"/>
  <text x="108" y="652" class="label">Use NO contacts.</text>
  <text x="266" y="652" class="small">The relays close S1 and S2 to camera GND only while the shutter outputs are HIGH.</text>
  <text x="1082" y="652" text-anchor="end" class="tiny">Pin assignment is firmware-specific</text>
</svg>
