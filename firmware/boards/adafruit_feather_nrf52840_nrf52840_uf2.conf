# Adafruit's UF2 bootloader stays on the board: no MCUboot, updates are drag and drop over USB.
# The app goes in the bootloader's application partition (0x26000), not at 0.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_USE_DT_CODE_PARTITION=y
# The board turns on a USB serial port; nothing talks on it and it keeps the chip awake
CONFIG_USB_DEVICE_STACK_NEXT=n
# nRF54L only
CONFIG_CLOCK_CONTROL_NRF_HFINT_CALIBRATION=n
