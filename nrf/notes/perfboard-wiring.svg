<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
  <title id="title">OpenRZ67 perfboard wiring</title>
  <desc id="description">Seeed XIAO nRF54L15, top view with USB-C pointing down. D1 drives AQY212EH number 1 and D2 drives number 2, each through 330 ohm; pin 2 of both relays goes to XIAO GND. Relay 1 switches camera S1 to camera GND, relay 2 switches camera S2 to camera GND. Camera 6 volt is not connected, and camera GND never touches XIAO GND.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .title { font-size: 28px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #52606d; }
      .tiny { font-size: 12px; fill: #68737d; }
      .pin { font-size: 14px; font-weight: 650; }
      .off { font-size: 14px; fill: #a0a8b0; }
      .board { fill: #e9f6f1; stroke: #17815f; stroke-width: 3; }
      .photo { fill: #fff7e8; stroke: #d88718; stroke-width: 3; }
      .camera { fill: #eef3ff; stroke: #456bd1; stroke-width: 3; }
      .drv { fill: none; stroke: #c13c66; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .gnd { fill: none; stroke: #27323a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .out { fill: none; stroke: #337f9c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .res { fill: #fff; stroke: #c13c66; stroke-width: 2; }
      .dip { fill: #27323a; }
      .leg { stroke: #8a939b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="790" fill="#fff"/>
  <text x="50" y="52" class="title">Perfboard trigger: XIAO nRF54L15 to Mamiya RZ67</text>
  <text x="50" y="80" class="small">Through-hole build. Two AQY212EH PhotoMOS relays and two 330 Ω resistors, nothing else.</text>

  <!-- XIAO, top view, USB-C down -->
  <text x="50" y="128" class="section">XIAO nRF54L15</text>
  <text x="50" y="150" class="small">Top view, USB-C pointing down</text>
  <rect x="60" y="180" width="240" height="440" rx="18" class="board"/>
  <rect x="150" y="610" width="60" height="30" rx="6" fill="#c9d3d0" stroke="#17815f" stroke-width="2"/>
  <text x="180" y="664" text-anchor="middle" class="tiny">USB-C</text>
  <text x="180" y="400" text-anchor="middle" class="small">nRF54L15</text>

  <!-- left edge, bottom to top: 5V GND 3V3 D10 D9 D8 D7 -->
  <circle cx="60" cy="560" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="565" class="off">5V</text>
  <circle cx="60" cy="505" r="7" fill="#27323a"/><text x="78" y="510" class="pin">GND</text>
  <circle cx="60" cy="450" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="455" class="off">3V3</text>
  <circle cx="60" cy="395" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="400" class="off">D10</text>
  <circle cx="60" cy="340" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="345" class="off">D9</text>
  <circle cx="60" cy="285" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="290" class="off">D8</text>
  <circle cx="60" cy="230" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="78" y="235" class="off">D7</text>

  <!-- right edge, bottom to top: D0 .. D6 -->
  <circle cx="300" cy="560" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="282" y="565" text-anchor="end" class="off">D0</text>
  <circle cx="300" cy="505" r="7" fill="#c13c66"/><text x="282" y="510" text-anchor="end" class="pin">D1</text>
  <circle cx="300" cy="450" r="7" fill="#c13c66"/><text x="282" y="455" text-anchor="end" class="pin">D2</text>
  <circle cx="300" cy="395" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="282" y="400" text-anchor="end" class="off">D3</text>
  <circle cx="300" cy="340" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="282" y="345" text-anchor="end" class="off">D4</text>
  <circle cx="300" cy="285" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="282" y="290" text-anchor="end" class="off">D5</text>
  <circle cx="300" cy="230" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/><text x="282" y="235" text-anchor="end" class="off">D6</text>

  <!-- XIAO GND -->
  <polyline points="53,505 30,505 30,530" class="gnd"/>
  <line x1="16" y1="530" x2="44" y2="530" stroke="#27323a" stroke-width="3"/>
  <line x1="21" y1="537" x2="39" y2="537" stroke="#27323a" stroke-width="3"/>
  <line x1="26" y1="544" x2="34" y2="544" stroke="#27323a" stroke-width="3"/>

  <text x="60" y="702" class="label">LiPo 1S, 100–300 mAh</text>
  <text x="60" y="724" class="small">On the BAT+ / BAT− pads on the underside. USB-C charges it.</text>

  <!-- relays -->
  <text x="400" y="128" class="section">PHOTOMOS RELAYS</text>
  <text x="400" y="150" class="small">Top view, dot = pin 1</text>

  <!-- relay 2: D2 -> camera S2 -->
  <text x="480" y="288" class="label">AQY212EH #2</text>
  <rect x="480" y="300" width="80" height="80" rx="6" class="dip"/>
  <circle cx="494" cy="314" r="5" fill="#fff"/>
  <line x1="465" y1="320" x2="480" y2="320" class="leg"/><line x1="465" y1="360" x2="480" y2="360" class="leg"/>
  <line x1="560" y1="320" x2="575" y2="320" class="leg"/><line x1="560" y1="360" x2="575" y2="360" class="leg"/>
  <text x="494" y="366" text-anchor="middle" class="tiny" style="fill:#fff">2</text>
  <text x="546" y="326" text-anchor="middle" class="tiny" style="fill:#fff">4</text>
  <text x="546" y="366" text-anchor="middle" class="tiny" style="fill:#fff">3</text>

  <!-- relay 1: D1 -> camera S1 -->
  <text x="480" y="458" class="label">AQY212EH #1</text>
  <rect x="480" y="470" width="80" height="80" rx="6" class="dip"/>
  <circle cx="494" cy="484" r="5" fill="#fff"/>
  <line x1="465" y1="490" x2="480" y2="490" class="leg"/><line x1="465" y1="530" x2="480" y2="530" class="leg"/>
  <line x1="560" y1="490" x2="575" y2="490" class="leg"/><line x1="560" y1="530" x2="575" y2="530" class="leg"/>
  <text x="494" y="536" text-anchor="middle" class="tiny" style="fill:#fff">2</text>
  <text x="546" y="496" text-anchor="middle" class="tiny" style="fill:#fff">4</text>
  <text x="546" y="536" text-anchor="middle" class="tiny" style="fill:#fff">3</text>

  <text x="400" y="600" class="small">Pin 1 LED+ · pin 2 LED− · pins 3 and 4 switch</text>
  <text x="400" y="622" class="small">The switch side has no polarity.</text>

  <!-- D2 -> R -> relay 2 pin 1 -->
  <polyline points="307,450 360,450 360,320 385,320" class="drv"/>
  <rect x="385" y="307" width="60" height="26" rx="5" class="res"/>
  <text x="415" y="325" text-anchor="middle" class="tiny">330 Ω</text>
  <line x1="445" y1="320" x2="465" y2="320" class="drv"/>

  <!-- D1 -> R -> relay 1 pin 1 -->
  <polyline points="307,505 360,505 360,490 385,490" class="drv"/>
  <rect x="385" y="477" width="60" height="26" rx="5" class="res"/>
  <text x="415" y="495" text-anchor="middle" class="tiny">330 Ω</text>
  <line x1="445" y1="490" x2="465" y2="490" class="drv"/>

  <!-- relay pin 2 -> XIAO GND -->
  <polyline points="465,360 455,360 455,385" class="gnd"/>
  <line x1="441" y1="385" x2="469" y2="385" stroke="#27323a" stroke-width="3"/>
  <line x1="446" y1="392" x2="464" y2="392" stroke="#27323a" stroke-width="3"/>
  <line x1="451" y1="399" x2="459" y2="399" stroke="#27323a" stroke-width="3"/>
  <polyline points="465,530 455,530 455,555" class="gnd"/>
  <line x1="441" y1="555" x2="469" y2="555" stroke="#27323a" stroke-width="3"/>
  <line x1="446" y1="562" x2="464" y2="562" stroke="#27323a" stroke-width="3"/>
  <line x1="451" y1="569" x2="459" y2="569" stroke="#27323a" stroke-width="3"/>
  <text x="400" y="666" class="small">
    <tspan font-weight="700" fill="#27323a">⏚</tspan> = XIAO GND. All three are one wire.</text>

  <!-- isolation barrier -->
  <line x1="610" y1="280" x2="610" y2="570" stroke="#9b7a43" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="610" y="268" text-anchor="middle" class="tiny">isolated</text>

  <!-- relay outputs -> camera -->
  <line x1="575" y1="320" x2="880" y2="320" class="out"/>
  <polyline points="575,360 640,360 640,410 880,410" class="out"/>
  <polyline points="575,490 640,490 640,410" class="out"/>
  <circle cx="640" cy="410" r="6" fill="#337f9c"/>
  <line x1="575" y1="530" x2="880" y2="530" class="out"/>

  <!-- camera -->
  <text x="860" y="128" class="section">RZ67 REMOTE PORT</text>
  <text x="860" y="150" class="small">Pin numbers as in the trigger README</text>
  <rect x="860" y="270" width="290" height="370" rx="18" class="camera"/>
  <circle cx="880" cy="320" r="7" fill="#337f9c"/>
  <text x="900" y="315" class="label">Pin 4 · S2</text>
  <text x="900" y="335" class="tiny">from AQY212EH #2</text>
  <circle cx="880" cy="410" r="7" fill="#337f9c"/>
  <text x="900" y="405" class="label">Pin 2 · GND</text>
  <text x="900" y="425" class="tiny">camera ground, from both relays</text>
  <circle cx="880" cy="530" r="7" fill="#337f9c"/>
  <text x="900" y="525" class="label">Pin 3 · S1</text>
  <text x="900" y="545" class="tiny">from AQY212EH #1</text>
  <circle cx="880" cy="600" r="7" fill="#fff" stroke="#a0a8b0" stroke-width="2"/>
  <text x="900" y="605" class="off">Pin 1 · 6 V, not connected</text>

  <text x="50" y="770" class="small">Camera GND (blue) and XIAO GND (black) never touch. That separation is the point of the PhotoMOS relays.</text>
</svg>
